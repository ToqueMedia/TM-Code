name = "ai-pass-through-worker"
main = "src/index.ts"
compatibility_date = "2026-06-02"

# Workers Logs persistentes — os console.* (incl. [billing] committed/failed)
# ficam consultáveis no dashboard (Observability → Logs) sem precisar de um
# `wrangler tail` aberto no momento do pedido. Essencial para validar a fase
# shadow do billing de forma assíncrona.
[observability]
enabled = true

[[kv_namespaces]]
binding = "ACTIVE_AI_CONFIG"
id = "b4052457452a4e84aedf332e055c4b1a"
preview_id = "replace-with-active-ai-config-kv-id"

[vars]
ACTIVE_AI_CONFIG_KEY = "active"
# Billing: 'off' (kill-switch) | 'shadow' (contabiliza + emite headers, nunca
# bloqueia) | 'enforce' (rejected → 402). Subir para 'enforce' só depois de
# validar os commits em shadow. Secrets FIREBASE_CLIENT_EMAIL /
# FIREBASE_PRIVATE_KEY (wrangler secret put) ativam o modo service-account
# nos reads/commits do Firestore; sem eles usa o ID token do utilizador.
BUDGET_ENFORCEMENT = "shadow"
