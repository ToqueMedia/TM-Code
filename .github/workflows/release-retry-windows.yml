name: Release Retry Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to complete'
        required: true
        default: '0.7.3'
      source_ref:
        description: 'Source ref to build'
        required: true
        default: 'main'

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          gh release view "${{ inputs.version }}" --repo ToqueMedia/TM-Code >/dev/null

  build-windows:
    needs: verify-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Import Windows certificate
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path certificate -Force
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt -Force
          if (-not (Test-Path certificate/certificate.pfx)) {
            throw 'Decoded Windows certificate was not created.'
          }
          Import-PfxCertificate `
            -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          VITE_USE_EMULATORS: 'false'
          VITE_WORKER_URL: 'https://api-agents.toquemedia.net'
          VITE_APPCHECK_ENABLED: 'false'
          VITE_DASHSCOPE_API_KEY: ${{ secrets.VITE_DASHSCOPE_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: 'maiplayer-ac56d.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'maiplayer-ac56d'
          VITE_FIREBASE_STORAGE_BUCKET: 'maiplayer-ac56d.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '113004896685'
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: 'G-S6V1T01G96'
        with:
          includeUpdaterJson: true

      - name: Upload artifacts to public repo release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          VERSION: ${{ needs.verify-release.outputs.version }}
        shell: pwsh
        run: |
          Get-ChildItem -Path src-tauri\target -Recurse -File |
            Where-Object {
              $_.FullName -match '\\bundle\\' -and (
                $_.Name -like '*.msi' -or
                $_.Name -like '*.msi.sig' -or
                $_.Name -like '*.exe' -or
                $_.Name -like '*.exe.sig' -or
                $_.Name -like '*.zip' -or
                $_.Name -like '*.zip.sig'
              )
            } |
            ForEach-Object {
              Write-Host "Uploading: $($_.FullName)"
              gh release upload "$env:VERSION" $_.FullName --repo ToqueMedia/TM-Code --clobber
            }

  generate-updater:
    needs: [verify-release, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate latest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          node scripts/generate-latest-json.mjs "${{ needs.verify-release.outputs.version }}"

  publish-release:
    needs: [verify-release, build-windows, generate-updater]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release (remove draft)
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          gh release edit "${{ needs.verify-release.outputs.version }}" \
            --repo ToqueMedia/TM-Code \
            --draft=false
