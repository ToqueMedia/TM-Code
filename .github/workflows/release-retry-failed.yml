name: Release Retry Failed Platforms

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to complete'
        required: true
        default: '0.7.3'
      source_ref:
        description: 'Source ref to build'
        required: true
        default: '0.7.3'

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          gh release view "${{ inputs.version }}" --repo ToqueMedia/TM-Code >/dev/null

  build-macos-apple-silicon:
    needs: verify-release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Import Apple certificate for code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: TOQUE MEDIA - PRESTACAO DE SERVICOS, LDA (D39GPSWXDH)'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_USE_EMULATORS: 'false'
          VITE_WORKER_URL: 'https://api-agents.toquemedia.net'
          VITE_APPCHECK_ENABLED: 'true'
          VITE_DASHSCOPE_API_KEY: ${{ secrets.VITE_DASHSCOPE_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: 'maiplayer-ac56d.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'maiplayer-ac56d'
          VITE_FIREBASE_STORAGE_BUCKET: 'maiplayer-ac56d.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '113004896685'
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: 'G-S6V1T01G96'
        with:
          args: --target aarch64-apple-darwin
          includeUpdaterJson: true

      - name: Upload artifacts to public repo release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ needs.verify-release.outputs.version }}"
          BARE_VERSION="${VERSION#v}"
          find src-tauri/target -path "*/bundle/*" -type f \( \
            -name "*.dmg" -o -name "*.dmg.sig" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \
          \) | while read file; do
            echo "Uploading: $file"
            gh release upload "$VERSION" "$file" --repo ToqueMedia/TM-Code --clobber
          done
          TAR_GZ=$(find src-tauri/target -name "*.app.tar.gz" -not -path "*/deps/*" | head -1)
          TAR_SIG=$(find src-tauri/target -name "*.app.tar.gz.sig" -not -path "*/deps/*" | head -1)
          if [ -n "$TAR_GZ" ]; then
            cp "$TAR_GZ" "TM.Code_${BARE_VERSION}_aarch64.app.tar.gz"
            gh release upload "$VERSION" "TM.Code_${BARE_VERSION}_aarch64.app.tar.gz" --repo ToqueMedia/TM-Code --clobber
            if [ -n "$TAR_SIG" ]; then
              cp "$TAR_SIG" "TM.Code_${BARE_VERSION}_aarch64.app.tar.gz.sig"
              gh release upload "$VERSION" "TM.Code_${BARE_VERSION}_aarch64.app.tar.gz.sig" --repo ToqueMedia/TM-Code --clobber
            fi
          fi

  build-macos-intel:
    needs: verify-release
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Import Apple certificate for code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: TOQUE MEDIA - PRESTACAO DE SERVICOS, LDA (D39GPSWXDH)'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_USE_EMULATORS: 'false'
          VITE_WORKER_URL: 'https://api-agents.toquemedia.net'
          VITE_APPCHECK_ENABLED: 'true'
          VITE_DASHSCOPE_API_KEY: ${{ secrets.VITE_DASHSCOPE_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: 'maiplayer-ac56d.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'maiplayer-ac56d'
          VITE_FIREBASE_STORAGE_BUCKET: 'maiplayer-ac56d.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '113004896685'
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: 'G-S6V1T01G96'
        with:
          args: --target x86_64-apple-darwin
          includeUpdaterJson: true

      - name: Upload artifacts to public repo release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ needs.verify-release.outputs.version }}"
          BARE_VERSION="${VERSION#v}"
          find src-tauri/target -path "*/bundle/*" -type f \( \
            -name "*.dmg" -o -name "*.dmg.sig" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \
          \) | while read file; do
            echo "Uploading: $file"
            gh release upload "$VERSION" "$file" --repo ToqueMedia/TM-Code --clobber
          done
          TAR_GZ=$(find src-tauri/target -name "*.app.tar.gz" -not -path "*/deps/*" | head -1)
          TAR_SIG=$(find src-tauri/target -name "*.app.tar.gz.sig" -not -path "*/deps/*" | head -1)
          if [ -n "$TAR_GZ" ]; then
            cp "$TAR_GZ" "TM.Code_${BARE_VERSION}_x64.app.tar.gz"
            gh release upload "$VERSION" "TM.Code_${BARE_VERSION}_x64.app.tar.gz" --repo ToqueMedia/TM-Code --clobber
            if [ -n "$TAR_SIG" ]; then
              cp "$TAR_SIG" "TM.Code_${BARE_VERSION}_x64.app.tar.gz.sig"
              gh release upload "$VERSION" "TM.Code_${BARE_VERSION}_x64.app.tar.gz.sig" --repo ToqueMedia/TM-Code --clobber
            fi
          fi

  generate-updater:
    needs: [verify-release, build-macos-apple-silicon, build-macos-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate latest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          node scripts/generate-latest-json.mjs "${{ needs.verify-release.outputs.version }}"

  publish-release:
    needs: [verify-release, build-macos-apple-silicon, build-macos-intel, generate-updater]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release (remove draft)
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          gh release edit "${{ needs.verify-release.outputs.version }}" \
            --repo ToqueMedia/TM-Code \
            --draft=false
