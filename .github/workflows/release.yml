name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create draft release on public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --repo ToqueMedia/TM-Code \
            --title "TM Code ${{ steps.version.outputs.version }}" \
            --notes "Download the installer for your platform below." \
            --draft

  build:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          VITE_USE_EMULATORS: 'false'
          VITE_WORKER_URL: 'https://api-agents.toquemedia.net'
          VITE_DASHSCOPE_API_KEY: ${{ secrets.VITE_DASHSCOPE_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: 'maiplayer-ac56d.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'maiplayer-ac56d'
          VITE_FIREBASE_STORAGE_BUCKET: 'maiplayer-ac56d.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '113004896685'
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: 'G-S6V1T01G96'
        with:
          # Build only — no release upload (we upload to the public repo separately)
          includeUpdaterJson: true

      - name: Upload artifacts to public repo release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"

          # Find release artifacts + signatures ONLY inside bundle directories.
          # Tauri places installers under target/**/release/bundle/ — restricting to
          # */bundle/* avoids uploading build tools (WiX), build scripts, and raw binaries.
          find src-tauri/target -path "*/bundle/*" -type f \( \
            -name "*.deb" -o -name "*.AppImage" -o \
            -name "*.AppImage.sig" -o -name "*.deb.sig" \
          \) | while read file; do
            echo "Uploading: $file"
            gh release upload "$VERSION" "$file" --repo ToqueMedia/TM-Code --clobber
          done

  generate-updater:
    # Runs AFTER all platform builds complete.
    # Builds the latest.json updater manifest from the release assets,
    # so all platforms are included in one file.
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Generate latest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          REPO="ToqueMedia/TM-Code"
          BARE_VERSION="${VERSION#v}"
          BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read .sig files from the release assets
          # Download all .sig files to get signatures
          mkdir -p sigs
          gh release download "$VERSION" --repo "$REPO" --pattern "*.sig" --dir sigs 2>/dev/null || true

          # Read signature file content (empty string if missing)
          read_sig() {
            if [ -f "sigs/$1" ]; then cat "sigs/$1"; else echo ""; fi
          }

          LINUX_APPIMAGE_SIG=$(read_sig "TM.Code_${BARE_VERSION}_amd64.AppImage.sig")

          # Build latest.json using jq to properly escape signatures (multi-line base64)
          jq -n \
            --arg ver "$BARE_VERSION" \
            --arg notes "TM Code $VERSION" \
            --arg date "$PUB_DATE" \
            --arg linux_sig "$LINUX_APPIMAGE_SIG" \
            --arg base "$BASE_URL" \
            --arg bv "$BARE_VERSION" \
            '{
              version: $ver,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "linux-x86_64":   { signature: $linux_sig,   url: ($base + "/TM.Code_" + $bv + "_amd64.AppImage") }
              }
            }' > latest.json

          echo "Generated latest.json:"
          cat latest.json

          gh release upload "$VERSION" latest.json --repo "$REPO" --clobber

  publish-release:
    needs: [create-release, build, generate-updater]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release (remove draft)
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          gh release edit "${{ needs.create-release.outputs.version }}" \
            --repo ToqueMedia/TM-Code \
            --draft=false
