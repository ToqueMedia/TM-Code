name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Frontend Build and Test
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.12'
        cache: 'npm'

    - name: Clean install dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install

    - name: Lint code
      run: npm run lint || echo "Linting not configured"

    - name: Type check
      run: npm run type-check || npx tsc --noEmit

    - name: Build frontend
      run: npm run build

    - name: Run tests
      run: npm test || echo "Tests not configured yet"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: dist/
        retention-days: 7

  # Backend Build and Test
  backend:
    name: Backend Build & Test (Rust)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src-tauri/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libxdo-dev

    - name: Check Rust formatting
      run: cd src-tauri && cargo fmt -- --check

    - name: Lint Rust code
      run: cd src-tauri && cargo clippy -- -D warnings

    - name: Build Rust backend
      run: cd src-tauri && cargo build --release

    - name: Run Rust tests
      run: cd src-tauri && cargo test

  # Full Application Build (Tauri)
  tauri-build:
    name: Build Tauri Application
    runs-on: ${{ matrix.os }}
    needs: [frontend, backend]
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.12'
        cache: 'npm'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src-tauri/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libxdo-dev

    - name: Install frontend dependencies
      run: |
        rm -rf node_modules package-lock.json
        npm install

    - name: Build Tauri application
      run: npm run tauri build

    - name: Upload Tauri artifacts (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: tauri-linux
        path: |
          src-tauri/target/release/bundle/deb/*.deb
          src-tauri/target/release/bundle/appimage/*.AppImage
        retention-days: 30

    - name: Upload Tauri artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: tauri-windows
        path: |
          src-tauri/target/release/bundle/msi/*.msi
          src-tauri/target/release/bundle/exe/*.exe
        retention-days: 30

    - name: Upload Tauri artifacts (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: tauri-macos
        path: |
          src-tauri/target/release/bundle/dmg/*.dmg
          src-tauri/target/release/bundle/macos/*.app
        retention-days: 30

  # Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.12'
        cache: 'npm'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install audit tools
      run: |
        npm install -g audit-ci
        cargo install cargo-audit

    - name: Audit npm dependencies
      run: |
        npm ci
        audit-ci --moderate

    - name: Audit Rust dependencies
      run: cd src-tauri && cargo audit

  # Release (only on main branch tags)
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [frontend, backend, tauri-build, security]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/tauri-linux/*
          artifacts/tauri-windows/*
          artifacts/tauri-macos/*
        body: |
          ## ToqueMedia Studio IDE Release ${{ github.ref_name }}
          
          ### Features
          - 🖥️ **Terminal Integration**: Professional terminal with command history and directory navigation
          - 🔍 **Global Search**: Powered by ripgrep for fast, accurate search across entire projects
          - 🐛 **Basic Debugger**: Node.js debugging with breakpoints, call stack, and variable inspection
          
          ### Downloads
          - **Linux**: `.deb` package and AppImage
          - **Windows**: `.msi` installer and standalone `.exe`
          - **macOS**: `.dmg` installer and `.app` bundle
          
          ### Installation Requirements
          - **Node.js**: Version 20.19+ or 22.12+ for development
          - **Ripgrep**: For search functionality (auto-installed on most systems)
          
          ### What's New
          See the [CHANGELOG.md](CHANGELOG.md) for detailed changes.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}