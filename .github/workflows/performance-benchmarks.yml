name: Performance Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Specific benchmark suite to run'
        required: false
        type: string

jobs:
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run benchmarks
        run: |
          mkdir -p benchmark-results
          if [ -n "${{ inputs.suite }}" ]; then
            yarn benchmark -- --suite "${{ inputs.suite }}" --output benchmark-results/results.json --format json
          else
            yarn benchmark -- --output benchmark-results/results.json --format json
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          retention-days: 30
