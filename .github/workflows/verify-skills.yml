name: Verify skills

on:
  pull_request:
    paths:
      - 'src-tauri/resources/skills/**'
      - 'scripts/verify-skills.ts'
      - '.github/workflows/verify-skills.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tsx
        run: npm install --no-save tsx@4

      - name: Validate bundled SKILL.md files
        run: npx tsx scripts/verify-skills.ts
