[package]
name = "toquemedia-studio"
version = "1.1.0"
description = "TM Code — The Agent-First IDE"
authors = ["Toque Media"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "toquemedia_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Use native-tls (Schannel on Windows, Secure Transport on macOS, OpenSSL on Linux)
# instead of the default rustls-tls. Avoids the `ring` crate which requires `clang`
# to compile assembly stubs on Windows ARM64.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"
thiserror = "1.0"
tauri-plugin-fs = { version = "2.5", features = ["watch"] }
flate2 = "1.0"
tar = "0.4"
tokio = { version = "1.0", features = ["full"] }
regex = "1.0"
glob = "0.3"
# .gitignore matching for the agent context file-tree (opt-in via
# FileTreeFilter.respect_gitignore). Same engine ripgrep uses; honours
# nested .gitignore files. The UI explorer leaves it off so ignored files
# (e.g. .env) stay visible/openable.
ignore = "0.4"
pdf-extract = "0.7"
# ── Motor de busca do ripgrep, LINKADO (2026-07-28) ──
# A busca corria `rg` como processo externo, com fallback silencioso para
# `grep` quando o binário faltava. Nas máquinas sem ripgrep instalado isso
# significava que TODA a busca do agente perdia o .gitignore (o `grep` não o
# conhece), e o transpilado inundava os resultados — enquanto o Glob, que usa
# o `ignore` acima, filtrava. Duas tools a descrever a mesma árvore de formas
# contraditórias. Estas três crates SÃO o ripgrep por dentro: linká-las junta
# as duas metades (walk+gitignore já cá estava, faltava a que procura) e
# elimina a classe de bug — não há binário para faltar, nem fallback para
# degradar em silêncio.
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
# Os include patterns da busca NÃO podem passar pelo `ignore::overrides`: lá,
# um acerto de whitelist curto-circuita os matchers de .gitignore, e um
# `includePatterns: ["*.js"]` devolvia o transpilado sem ninguém o pedir
# (sessão momenu-fact 23:08). Filtram-se à parte, com globset — só estreitam,
# nunca destrancam. Já vinha transitivamente pelo `ignore`; agora é explícito.
globset = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
futures-util = "0.3"
tauri-plugin-localhost = "2.3.2"
wry = "0.54"
portable-pty = { version = "0.8", features = ["serde"] }
anyhow = "1.0"
libc = "0.2"
machine-uid = "0.5"
sha2 = "0.10"
base64 = "0.22"
# Redimensionar/recodificar as imagens geradas antes de as pousar no projecto.
# Já vinha na árvore como dependência transitiva do Tauri, por isso o custo de
# compilação é ~nulo. Só png+jpeg: são os dois formatos que o encoder do crate
# suporta bem e chegam para assets de frontend (o WebP do `image` 0.25 só
# descodifica). Sem isto, a tool aconselhava a comprimir e não dava com quê.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Local HTTP proxy for the team live-preview tunnel (viewer side). Pure Rust;
# already in the tree transitively via tauri-plugin-localhost.
tiny_http = "0.12"
# Cross-platform screen region capture used by the Preview "📸 Screenshot →
# chat" floating button. The crate re-exports its bundled `image` (0.24) so
# we don't depend on it separately — having two `image` versions in the build
# graph causes `ImageFormat::From` mismatches in `write_to` calls.
screenshots = "0.8"
# OS keychain access for BYOK API keys.
# - macOS: Security framework (requires keychain-access-groups entitlement in prod)
# - Windows: Credential Manager
# - Linux: libsecret (requires gnome-keyring or kwallet running)
# Linux fallback to encrypted file is a known follow-up if libsecret friction
# becomes a real issue in the field.
keyring = "3"
# SQLite for the in-IDE Data Viewer (read-only access to the project's
# local `dev.db`). The `bundled` feature compiles SQLite from C source so
# we don't depend on a system libsqlite3 — matches our preference for
# self-contained Tauri binaries on all platforms.
rusqlite = { version = "0.32", features = ["bundled"] }
# Note: hostname intentionally NOT included in the fingerprint inputs (see
# device.rs). machine-uid alone gives the stability we want without the
# user-mutable bypass vector.

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSRunningApplication", "NSView", "NSWindow", "NSResponder", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
# Vibrancy via NSVisualEffectView. Tauri-team-maintained; talks to private API
# already enabled by `macos-private-api` on the tauri crate.
window-vibrancy = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
# Same crate handles Mica (Win 11) / Acrylic (Win 10) on Windows.
window-vibrancy = "0.5"
