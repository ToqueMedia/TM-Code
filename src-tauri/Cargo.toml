[package]
name = "toquemedia-studio"
version = "0.1.5"
description = "TM Code — The Agent-First IDE"
authors = ["Toque Media"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "toquemedia_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.0", features = ["v4"] }
dirs = "5.0"
thiserror = "1.0"
tauri-plugin-fs = "2.4.2"
flate2 = "1.0"
tokio = { version = "1.0", features = ["full"] }
regex = "1.0"
glob = "0.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tauri-plugin-localhost = "2.3.2"
wry = "0.54"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSRunningApplication", "NSView", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

