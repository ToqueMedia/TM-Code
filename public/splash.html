<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TM Code</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-app-region: drag;
      }
      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(
          ellipse at center,
          rgba(254, 16, 99, 0.10) 0%,
          rgba(10, 10, 10, 0.92) 70%
        );
        animation: fadeIn 220ms ease-out both;
      }
      .wordmark {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #FE1063 0%, #a371f7 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 2px 8px rgba(254, 16, 99, 0.25));
      }
      .tagline {
        font-size: 11px;
        color: rgba(230, 237, 243, 0.45);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .dots {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #FE1063;
        opacity: 0.25;
        animation: pulse 1.05s ease-in-out infinite;
      }
      .dot:nth-child(2) { animation-delay: 0.18s; }
      .dot:nth-child(3) { animation-delay: 0.36s; }

      @keyframes pulse {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage, .dot { animation: none; }
        .dot { opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="wordmark">TM Code</div>
      <div class="tagline">Loading workspace</div>
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </body>
</html>
