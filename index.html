<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TM Code</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Disable browser context menu in production only — keep Reload/Inspect in dev
      // In dev: Vite runs on port 1420. In prod: tauri-plugin-localhost runs on 14300.
      if (location.port !== '1420') {
        document.addEventListener('contextmenu', function(e) {
          var el = e.target;
          var tag = el.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable) return;
          e.preventDefault();
        });
      }

      // ── OAuth popup bridge ──────────────────────────────────────────
      // Tauri WebViews can't create browser popups via window.open().
      // Rust on_new_window creates a real WebviewWindow for OAuth domains
      // and injects a bridge script that forwards postMessage via Tauri events.
      // Here we: (a) return a proxy so Firebase doesn't throw "popup-blocked",
      // (b) forward the event as a MessageEvent so signInWithPopup completes.
      var _origOpen = window.open;
      window._oauthProxy = null;

      window.open = function(url, target, features) {
        var result = _origOpen.call(window, url, target, features);
        if (result === null && url) {
          window._oauthProxy = { closed: false, close: function() { this.closed = true; }, focus: function() {} };
          return window._oauthProxy;
        }
        return result;
      };
    </script>
  </body>
</html>
