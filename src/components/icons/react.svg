<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="reactGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#61DAFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#21A6C4;stop-opacity:1" />
    </linearGradient>
  </defs>

  
  <!-- React Atom Symbol -->
  <g transform="translate(16,16)">
    <!-- Electron orbits -->
    <ellipse cx="0" cy="0" rx="11" ry="4.2" fill="none" stroke="url(#reactGradient)" stroke-width="1.2" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="11" ry="4.2" fill="none" stroke="url(#reactGradient)" stroke-width="1.2" opacity="0.8" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="11" ry="4.2" fill="none" stroke="url(#reactGradient)" stroke-width="1.2" opacity="0.8" transform="rotate(120)"/>
    
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="2" fill="url(#reactGradient)"/>
    
    <!-- Electrons -->
    <circle cx="11" cy="0" r="1.8" fill="url(#reactGradient)" opacity="0.9"/>
    <circle cx="-5.5" cy="9.5" r="1.8" fill="url(#reactGradient)" opacity="0.9"/>
    <circle cx="-5.5" cy="-9.5" r="1.8" fill="url(#reactGradient)" opacity="0.9"/>
  </g>
</svg>